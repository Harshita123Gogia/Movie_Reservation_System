<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineReserve | Movie Ticket Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .screen-curve {
            height: 12px;
            background: linear-gradient(to bottom, #ef4444, transparent);
            border-radius: 50% / 100% 100% 0 0;
            box-shadow: 0px 8px 25px rgba(239, 68, 68, 0.6);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/" class="flex items-center gap-2 text-2xl font-black text-red-500 tracking-wider">
                <span>🎬</span> CINERESERVE
            </a>
            <div id="auth-controls" class="flex items-center space-x-3">
                <button onclick="showAuthModal(true)" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-5 py-2 rounded-lg transition shadow-lg shadow-red-600/20">
                    Sign In
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-6 w-full flex-grow">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">Now Showing</h1>
                <p class="text-slate-400 text-sm">Select a movie and choose an available showtime</p>
            </div>
            <div class="flex items-center gap-3 bg-slate-900 p-2 rounded-xl border border-slate-800">
                <label for="date-filter" class="text-xs font-bold text-slate-400 uppercase tracking-wider pl-2">Filter Date:</label>
                <input type="date" id="date-filter" onchange="loadMovies()" class="bg-slate-800 text-white border border-slate-700 rounded-lg p-2 text-sm focus:outline-none focus:border-red-500">
            </div>
        </div>

        <div id="movie-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <!-- Interactive Seat Selection Modal -->
    <div id="seat-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-2xl max-w-xl w-full text-center shadow-2xl relative">
            <button onclick="closeSeatModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">✕</button>
            
            <h3 class="text-xl font-bold mb-1" id="modal-movie-title">Select Seats</h3>
            <p class="text-xs text-slate-400 mb-6" id="modal-showtime-info"></p>

            <!-- Cinema Screen Visual -->
            <div class="mb-8 px-8">
                <div class="screen-curve mb-2"></div>
                <span class="text-[10px] tracking-widest text-slate-500 uppercase font-bold">SCREEN</span>
            </div>

            <!-- Seat Grid -->
            <div id="seat-grid" class="grid grid-cols-6 gap-2.5 mb-6 max-h-60 overflow-y-auto p-2"></div>

            <!-- Seat Legend -->
            <div class="flex justify-center gap-6 text-xs text-slate-400 mb-6 border-t border-slate-800 pt-4">
                <div class="flex items-center gap-2">
                    <span class="w-4 h-4 rounded bg-slate-800 border border-slate-700 inline-block"></span> Available
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-4 h-4 rounded bg-emerald-600 inline-block"></span> Selected
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-4 h-4 rounded bg-red-950 border border-red-800 opacity-60 inline-block"></span> Occupied
                </div>
            </div>

            <div class="flex justify-between items-center border-t border-slate-800 pt-4">
                <span id="selected-count" class="text-sm font-semibold text-slate-300">0 seats selected</span>
                <div class="space-x-2">
                    <button onclick="closeSeatModal()" class="px-4 py-2 text-slate-400 hover:text-white text-sm font-medium">Cancel</button>
                    <button onclick="confirmBooking()" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg font-bold transition shadow-lg shadow-red-600/30">Reserve Seats</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full shadow-2xl">
            <h3 class="text-2xl font-bold mb-4" id="auth-title">Sign In</h3>
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Username</label>
                    <input type="text" id="auth-username" required class="w-full bg-slate-800 border border-slate-700 text-white p-2.5 rounded-lg focus:outline-none focus:border-red-500">
                </div>
                <div id="email-field-container" class="hidden">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Email</label>
                    <input type="email" id="auth-email" class="w-full bg-slate-800 border border-slate-700 text-white p-2.5 rounded-lg focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                    <input type="password" id="auth-password" required class="w-full bg-slate-800 border border-slate-700 text-white p-2.5 rounded-lg focus:outline-none focus:border-red-500">
                </div>
                <div class="flex justify-between items-center text-sm pt-2">
                    <button type="button" onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-slate-400 hover:text-red-400 text-xs">Need an account? Register</button>
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white p-3 rounded-lg font-bold transition shadow-lg shadow-red-600/30">Continue</button>
            </form>
            <button onclick="showAuthModal(false)" class="mt-4 w-full text-slate-500 hover:text-slate-300 text-xs text-center">Close</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
